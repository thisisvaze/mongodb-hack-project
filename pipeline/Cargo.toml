[package]
name = "pipeline"
version = "0.1.0"
edition = "2021"

# Dependency features are kept minimal on purpose: fewer crates, faster builds.
[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "multipart"] }
base64 = "0.22"
dotenvy = "0.15"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
mongodb = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

# Full debug info is the slowest part of a dev build; line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"

# Image decoding is far too slow unoptimised, so optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

# Release builds normally recompile the whole crate on any change. Incremental
# mode reuses the unchanged parts; the pipeline spends its time waiting on the
# network, so the slightly less optimised code costs nothing measurable.
[profile.release]
incremental = true
